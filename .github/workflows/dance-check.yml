name: Game browser checks
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - docs/index.html
      - docs/version.txt
      - docs/motion-entry.js
      - docs/course.js
      - tools/check-course.mjs
      - docs/hero-motion.js
      - docs/animation-test.html
      - docs/models/studies/**
      - tools/check-motion-browser.cjs
      - tools/check-motion-integration.mjs
      - docs/models/mishka.js
      - docs/models/sova.js
      - docs/models/winter.js
      - tools/check-dances.cjs
      - tools/check-gameplay.cjs
      - tools/check-assets.cjs
      - .github/workflows/dance-check.yml
concurrency:
  group: dance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Prepare browser
        run: |
          npm install --prefix "$RUNNER_TEMP/dance-browser" --no-package-lock playwright
          "$RUNNER_TEMP/dance-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check dances and gameplay at phone size
        env:
          DANCE_BROWSER_MODULE: ${{ runner.temp }}/dance-browser/node_modules/playwright
        run: |
          node tools/serve.cjs docs 8766 > "$RUNNER_TEMP/dance-server.log" 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8766/version.txt && break || sleep 1; done
          node tools/check-dances.cjs
          node tools/check-gameplay.cjs
          node tools/check-assets.cjs
          node tools/check-course.mjs
          node tools/check-motion-integration.mjs
          node tools/check-motion-browser.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dance-phone-check
          path: dance-checks
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: winter-asset-phone-check
          path: asset-checks
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: gameplay-phone-check
          path: gameplay-checks
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: motion-phone-check
          path: motion-checks
          retention-days: 7
