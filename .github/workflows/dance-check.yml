name: Unity Web game checks
on:
  push:
    branches: [main, 'migration/unity-web']
    paths:
      - 'docs/**'
      - 'tools/check-*'
      - 'unity/OwlSlope/**'
      - '.github/workflows/dance-check.yml'
  workflow_dispatch:
concurrency:
  group: unity-web-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify routing, profile isolation and model catalog
        run: |
          node tools/check-unity-entry.cjs
          node tools/check-unity-platform.cjs
          node tools/check-unity-platform-catalog.cjs
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/unity-browser" --no-package-lock playwright
          "$RUNNER_TEMP/unity-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Play the compiled Unity Web release
        env:
          DANCE_BROWSER_MODULE: ${{ runner.temp }}/unity-browser/node_modules/playwright
        run: |
          node tools/serve.cjs docs 8784 > "$RUNNER_TEMP/unity-http.log" 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8784/version.txt && break || sleep 1; done
          node tools/check-unity-host.cjs http://127.0.0.1:8784/unity/
          node tools/check-unity-host.cjs http://127.0.0.1:8784/unity-test/
          node tools/check-unity-entry-browser.cjs http://127.0.0.1:8784/ --software
          node tools/check-mountain-web.cjs http://127.0.0.1:8784/
          node tools/check-unity-platform-browser.cjs http://127.0.0.1:8784/unity-test/
          node tools/check-mountain-audio.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unity-web-mobile
          path: course-checks/mountain-race
          retention-days: 7
