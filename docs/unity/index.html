<!doctype html>
<html lang="ru">
<head>
  <base href="../unity-test/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183c56">
  <title>Белая Сова · Спуск</title>
  <link rel="icon" type="image/jpeg" href="art/av_owl.jpg">
  <link rel="stylesheet" href="race.css?v=82d526946e4a">
  <script src="vendor/telegram-web-app.js?v=e999954b603b"></script>
  <script src="../unity/release.js?v=a4c26d9bd7f8"></script><script src="save.js?v=22dd03bb9afd"></script><script src="equipment.js?v=cad7dba31903"></script>
  <script defer src="mountain-audio.js?v=4a1e7fcd87e4"></script><script defer src="mountain-metrics.js?v=2c1afe0401dc"></script>
</head>
<body><main id="app">
  <canvas id="slope" aria-label="Горнолыжная трасса" tabindex="0"></canvas>
  <div id="safe">
    <header id="mast" hidden>
      <button class="record-pill" data-panel="top" aria-label="Рейтинг и личный рекорд"><span aria-hidden="true">🏆</span><strong id="best">0</strong><small id="menuRank"></small></button>
      <span class="wallet-pill" aria-label="Мандарины в кошельке"><span aria-hidden="true">🍊</span><strong id="bank">0</strong></span>
      <button class="settings-key" data-panel="settings" aria-label="Настройки">⚙</button>
    </header>
    <section id="loading" class="sheet" aria-live="polite">
      <h2>Готовим склон</h2><p id="loadText">Загружаем игру…</p>
      <progress id="loadBar" max="1" value="0" aria-label="Загрузка игры"></progress>
      <button id="retryLoad" hidden>Повторить загрузку</button>
    </section>
    <section id="menu" class="sheet home" hidden aria-label="Главное меню">
      <div class="row picks" aria-label="Выбор героя">
        <button data-hero="bear" aria-pressed="false"><img src="art/av_bear.jpg" alt=""><span>Мишаня<small>Лыжи · сносит сугробы</small></span></button>
        <button data-hero="owl" aria-pressed="false"><img src="art/av_owl.jpg" alt=""><span>Сова<small>Сноуборд · долго парит</small></span></button>
      </div>
      <div class="row start-row"><button id="play" class="primary" data-mode="normal">Поехали! <span aria-hidden="true">➜</span></button></div>
      <nav class="utilities" aria-label="Разделы игры">
        <button data-panel="missions"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m8 12 2 2 5-5m-7 8h7"/></svg>Задания</button><button data-panel="collection"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="6" width="15" height="15" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12m-10-7 1.1 2.2 2.4.4-1.7 1.6.4 2.4-2.2-1.1-2.1 1.1.4-2.4-1.8-1.6 2.4-.4z"/></svg>Коллекция</button>
        <button data-panel="shop"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 19 15 4q1-1.5 2-.8t-.1 2.4L6 20q-2 2-3 .2m6 .8L20 6q1-1.4 2-.6M5 4l11 16m-3-1 4-3M3 6l3-2"/></svg>Магазин</button><button data-panel="bonuses"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 9h18v4H3zm2 4v8h14v-8M12 9v12"/><path d="M12 9C9 9 6 8 6 5.8 6 3.4 10 3 12 9Zm0 0c3 0 6-1 6-3.2C18 3.4 14 3 12 9Z"/></svg>Бонусы</button>
      </nav>
      <button class="rules-link" data-panel="rules">Правила FIS · <b id="ruleCount">0/10</b></button>
    </section>
    <div id="hud" hidden>
      <div id="course"><b id="metres"></b><div id="speedometer"><span class="speed-dial" aria-hidden="true"><i></i></span><b id="pace"></b></div><b id="multiplier" hidden></b></div>
      <div id="rideInfo"><span id="stage"></span><span id="rideStatus" hidden></span><aside id="notice" hidden></aside></div>
      <div id="rewardFloats" aria-hidden="true"></div>
      <div class="scoreboard" aria-label="Счёт, каски и мандарины">
        <b id="score">0</b><div id="helmets"><img src="art/helmet-59b.webp" alt=""><img src="art/helmet-59b.webp" alt=""><img src="art/helmet-59b.webp" alt=""></div>
        <b id="coins">0</b>
      </div>
      <button id="pause" aria-label="Пауза">Ⅱ</button>
    </div>
    <section id="review" class="sheet" hidden>
      <div class="row"><b>Осмотр · <output id="reviewMetres">0</output> м</b><button id="reviewFold" aria-expanded="true">Свернуть</button><button id="reviewExit">В меню</button></div>
      <div id="reviewBody"><div class="row"><select id="reviewRide" aria-label="Трасса осмотра"><option value="normal">Полный спуск</option><option value="tubing">Плюшки</option><option value="sled">Снегоход</option></select><select id="reviewHero" aria-label="Герой осмотра"><option value="owl">Сова</option><option value="bear">Мишаня</option></select></div><label>Перемотка
      <input id="seek" aria-label="Положение на трассе" type="range" min="0" max="143999" step="1" value="0"></label>
      <div class="row"><button id="reviewEarlier">−100 м</button><input id="reviewAt" aria-label="Перейти на метр" type="number" min="0" max="143999" step="1" value="0"><button id="reviewLater">+100 м</button></div>
      <div class="row"><select id="reviewRate" aria-label="Скорость осмотра">
        <option value="0">Стоп</option><option value=".25">¼×</option><option value="1">1×</option><option value="3">3×</option><option value="6">6×</option></select>
        <button id="reviewStep">Один кадр</button><button id="reviewPlay">Проехать отсюда</button></div>
      <label>Положение поперёк склона<input id="reviewLane" type="range" min="-9" max="9" step=".25" value="0"></label>
      <div class="row"><select id="reviewStage" aria-label="Этап"></select><select id="reviewEffect" aria-label="Событие осмотра"><option value="normal">Обычный спуск</option><option value="coffee">Кофе</option><option value="jump">Прыжок</option></select></div></div>
    </section>
    <section id="paused" class="sheet" hidden><h2>Пауза</h2><p id="pausedDist"></p>
      <div id="pauseVolumes"></div>
      <label>Чувствительность · <output id="pauseSenseValue">4</output><input type="range" id="pauseSense" min="1" max="10" step="1"></label>
      <button id="resume" class="primary">Продолжить</button>
      <div class="row"><button id="restartPaused">Сначала</button><button id="exitPaused">В меню</button></div>
    </section>
    <section id="result" class="sheet" hidden><h2 id="resultTitle">Финиш</h2><strong id="resultScore"></strong>
      <p id="resultStats"></p><p id="resultExtra" hidden></p><p id="rankStatus" role="status"></p>
      <div id="breakdown" hidden aria-label="Состав очков заезда"></div>
      <p id="resultRule" hidden></p><details id="resultTasks"><summary>Задания заезда</summary><div></div></details>
      <button id="again" class="primary">Ещё заезд</button>
      <p id="resultBonuses" hidden>Золотые перья можно потратить в магазине и в разделе «Бонусы».</p>
      <div class="row"><button id="share">Поделиться</button><button id="exitResult">В меню</button></div>
    </section>
    <section id="shareSheet" class="sheet" aria-label="Карточка заезда" hidden>
      <div class="heading"><h2>Карточка заезда</h2><button id="closeShare" aria-label="Закрыть карточку">×</button></div>
      <img id="shareImage" alt="Результат спуска">
      <p id="shareHint" role="status">Удержи картинку, чтобы сохранить её.</p>
      <div class="row"><button id="copyShare">Копировать текст</button><button id="sendShare" class="primary">Отправить</button></div>
    </section>
    <small id="previewHint" hidden>Поверни модель пальцем</small>
    <section id="panel" class="sheet" hidden><div class="heading"><h2 id="panelTitle"></h2><button id="closePanel" aria-label="Закрыть">×</button></div>
      <div id="panelBody"></div>
    </section>
  </div>
</main><script src="race.js?v=8dbf04d85e3e"></script>
<script>
  MountainShell.boot({
    loader:'Build/d109bfcc1016b6c0da463a54d6b0a459.loader.js', data:'Build/353b728e5796e8c7a539e16f7eb1d0db.data.unityweb',
    framework:'Build/b7aa5d04801d45d71467f9dd9ea55003.framework.js.unityweb', code:'Build/4739a93868bb08c671cb619e0902ac63.wasm.unityweb'
  });
</script></body></html>
