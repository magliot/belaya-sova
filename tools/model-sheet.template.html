<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лист моделей · Белая Сова</title>
<style>
@font-face{font-family:Rubik;src:url(fonts/rubik-cyrillic-500-normal.woff2)}*{box-sizing:border-box}body{background:#eef3f4;color:#173246;font:16px/1.45 Rubik,system-ui,sans-serif;margin:0}main{max-width:1230px;margin:auto;padding:24px}a{color:#255677}h1{margin:20px 0 4px;font-size:clamp(32px,5vw,58px);line-height:1.1}header p{max-width:70ch}nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}button{cursor:pointer;font:inherit;padding:8px 14px;background:white;color:#20475b;border:1px solid #a1b7c1;border-radius:18px}button[aria-pressed=true]{background:#173d50;color:white}section{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:12px}figure{margin:0;overflow:hidden;border-radius:12px;background:#fff;break-inside:avoid}img{display:block;width:100%;aspect-ratio:32/23;object-fit:contain;background:#dbe8ee}figcaption{padding:11px 14px 16px}small{color:#4e6674}h2{margin:3px 0 6px;font-size:19px}figure p{font-size:14px;margin:0}figure[hidden]{display:none}@media print{body,main{padding:0;background:white}a,nav,header p{display:none}section{grid-template-columns:repeat(4,1fr)}figure{border:1px solid #ccd6db}img{max-height:100px}figcaption{padding:5px}h2{font-size:13px}figure p,small{font-size:10px}}
</style></head><body><main><header><a href="./">← В игру</a><h1>Лист моделей</h1><p>Здесь можно рассмотреть предметы «Белой Совы» по отдельности. У объектов из кода указано, какие детали можно перенести в Blender или Tripo.</p></header><nav aria-label="Виды объектов"><button data-filter="all" aria-pressed="true">Все</button><button data-filter="1" aria-pressed="false">Объекты из кода</button><button data-filter="0" aria-pressed="false">Модели</button><button data-filter="2" aria-pressed="false">Запасные формы</button><button onclick="print()">Печать / PDF</button></nav><section><!--CARDS--></section></main>
<script>for(const button of document.querySelectorAll('[data-filter]'))button.onclick=()=>{for(const b of document.querySelectorAll('[data-filter]'))b.setAttribute('aria-pressed',String(b===button));for(const f of document.querySelectorAll('figure'))f.hidden=button.dataset.filter!=='all'&&f.dataset.group!==button.dataset.filter;};</script></body></html>
