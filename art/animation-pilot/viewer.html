<header><small>Белая Сова · Анимационная проба 01</small><h1>Мишаня. Вес и опора</h1><p>Стойка → поворот → прыжок → приземление</p></header>
<section class="panel"><div class="row"><span class="phase" id="phase">Загрузка…</span><span class="time" id="time">0.00 / 6.00</span></div><input aria-label="Время движения" id="timeline" type="range" min="0" max="6" step=".01" value="0"><div class="row"><button id="play">Пауза</button><button data-view="three" class="active">¾</button><button data-view="front">Спереди</button><button data-view="side">Сбоку</button><button data-view="back">Сзади</button><button id="speed">×1</button></div><p class="note" style="margin-top:12px">Рабочий образец · пока не включён в игру</p></section>

<script type="module">
import * as THREE from 'three';import{GLTFLoader}from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdfe9ee);scene.fog=new THREE.Fog(0xdfe9ee,7,20);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement);

function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;const distance=innerWidth<500?3.3:2.7;const dirs={three:[.5,.25,1],front:[0,.2,1],side:[1,.2,0],back:[0,.25,-1]};const d=new THREE.Vector3(...dirs[view]).normalize().multiplyScalar(distance);camera.position.copy(new THREE.Vector3(0,.55,0).add(d));camera.lookAt(0,.55,0);camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xffffff,0x94a7ba,2));const sun=new THREE.DirectionalLight(0xfff5e8,3);sun.position.set(-2,4,-3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-2,right:2,top:2,bottom:-2,near:.1,far:12});sun.shadow.bias=-.00015;sun.shadow.normalBias=.008;scene.add(sun);const rim=new THREE.DirectionalLight(0xd8ebff,1.8);rim.position.set(2,2,2);scene.add(rim);

let mixer,model,t=0,playing=true,speed=1,duration=6;
const phase=t=>t<.8?'Стойка':t<2.7?'Перенос веса':t<3.25?'Подготовка и отрыв':t<4.08?'Полёт':t<4.48?'Приземление': 'Восстановление';
function pose(time){t=Math.max(0,Math.min(duration,time));mixer?.setTime(t);model?.updateMatrixWorld(true);document.querySelector('#timeline').value=t;document.querySelector('#phase').textContent=phase(t);document.querySelector('#time').textContent=t.toFixed(2)+' / '+duration.toFixed(2);renderer.render(scene,camera)}
document.querySelector('#timeline').oninput=e=>{playing=false;document.querySelector('#play').textContent='Играть';pose(+e.target.value)};
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Пауза':'Играть'};document.querySelector('#speed').onclick=e=>{speed=speed===1?.35:1;e.target.textContent=speed===1?'×1':'×0.35'};

try{const gltf=await new GLTFLoader().loadAsync('mishanya-ski-study.glb');model=gltf.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false}});mixer=new THREE.AnimationMixer(model);for(const clip of gltf.animations)mixer.clipAction(clip).play();duration=Math.max(...gltf.animations.map(c=>c.duration));window.pilot={ready:true,pose,model,clips:gltf.animations,view(v){view=v;resize();pose(t)},freeze(){playing=false},measure(){model.updateMatrixWorld(true);const result={};model.traverse(o=>{if(o.isBone&&/Foot$/.test(o.name))result[o.name]=o.getWorldPosition(new THREE.Vector3()).toArray()});return result}};pose(0)}catch(e){document.querySelector('#phase').textContent='Не удалось загрузить модель';console.error(e)}
let last=performance.now();function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing&&mixer)pose((t+dt*speed)%duration);requestAnimationFrame(tick)}requestAnimationFrame(tick);
